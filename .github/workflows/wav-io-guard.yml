# WAV I/O Guardrail — Prevent scipy.io.wavfile outside canonical module
#
# This workflow fails if `wavfile.read` or `wavfile.write` appears in any Python
# file except the canonical `tap_tone_pi/io/wav.py`.

name: wav-io-guard

on:
  push:
    paths:
      - "**.py"
  pull_request:
    paths:
      - "**.py"

jobs:
  check-wav-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unauthorized wavfile usage
        shell: bash
        run: |
          echo "Scanning for scipy.io.wavfile usage outside canonical module..."

          # Pattern: wavfile.read or wavfile.write
          # Exclude: tap_tone_pi/io/wav.py (canonical module)

          violations=$(grep -rn --include="*.py" \
            -e "wavfile\.read" \
            -e "wavfile\.write" \
            -e "from scipy.io import wavfile" \
            . \
            | grep -v "tap_tone_pi/io/wav.py" \
            | grep -v "__pycache__" \
            | grep -v ".pyc" \
            || true)

          if [ -n "$violations" ]; then
            echo ""
            echo "❌ ERROR: Direct wavfile usage found outside canonical module!"
            echo ""
            echo "Violations:"
            echo "$violations"
            echo ""
            echo "All WAV I/O must go through: tap_tone_pi/io/wav.py"
            echo ""
            echo "Use one of:"
            echo "  from tap_tone_pi.io.wav import read_wav_mono, read_wav_stereo"
            echo "  from tap_tone_pi.io.wav import write_wav_mono"
            echo ""
            exit 1
          fi

          echo "✅ No unauthorized wavfile usage found."
