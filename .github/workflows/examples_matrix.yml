name: measurement-examples
on: [push, pull_request]

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate measurement examples
        run: |
          python - <<'PY'
          import json
          from jsonschema import validate

          # Canonical schemas live under contracts/schemas/. Each example is
          # validated against its specific schema (mirrors
          # tests/test_measurement_schemas.py). Examples without a published
          # schema (tap_tone.json, bending_test.json) are intentionally not
          # validated here.
          PAIRS = [
              ("examples/measurement/tap_peaks.json",
               "contracts/schemas/tap_peaks.schema.json"),
              ("examples/measurement/moe_result.json",
               "contracts/schemas/moe_result.schema.json"),
              ("examples/measurement/manifest.json",
               "contracts/schemas/manifest.schema.json"),
              ("examples/measurement/displacement_series.json",
               "contracts/schemas/displacement_series.schema.json"),
              ("examples/measurement/load_series.json",
               "contracts/schemas/load_series.schema.json"),
          ]

          for data_path, schema_path in PAIRS:
              data = json.load(open(data_path))
              schema = json.load(open(schema_path))
              validate(data, schema)
              print("OK", data_path)
          print("All examples validated")
          PY
