[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-tone-pi"
version = "0.1.0"
description = "Offline tap tone analyzer for Raspberry Pi"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4.6",
]

[project.scripts]
tap-tone = "tap_tone.main:main"
