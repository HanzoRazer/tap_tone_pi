[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-tone-pi"
version = "2.3.0-alpha.5"
description = "Tap tone analysis toolkit for luthiers: capture, analyze, and visualize acoustic signatures"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4.6",
  "pyserial>=3.5",
  "matplotlib>=3.7",
  "jsonschema>=4.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.10",
  "ruff>=0.4.0",
  "pre-commit>=3.7",
  "build>=1.0",
]
server = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "httpx>=0.24",
]

[project.scripts]
# Primary entry point (unified CLI)
ttp = "tap_tone_pi.cli.main:main"
# Legacy alias (backward compatibility - points to same unified CLI)
tap-tone = "tap_tone_pi.cli.main:main"

[tool.setuptools.packages.find]
include = ["tap_tone_pi", "tap_tone_pi.*", "tap_tone", "tap_tone.*"]
