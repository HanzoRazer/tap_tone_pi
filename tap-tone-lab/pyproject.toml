[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-tone-lab"
version = "0.3.0"
description = "Offline tap-tone lab: Phase 1 (single-channel) + Phase 2 (2ch coherence/phase/delay) with durable bundles."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4.6",
  "matplotlib>=3.7",
  "jsonschema>=4.19",
]

[project.scripts]
tap-tone = "tap_tone.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tap_tone*"]
