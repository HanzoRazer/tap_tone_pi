[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-tone-lab"
version = "0.2.1"
description = "Offline tap-tone lab: 2-channel capture, coherence/phase/delay, artifact bundles, and validation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4.6",
  "matplotlib>=3.7",
  "jsonschema>=4.19",
]

[tool.setuptools]
package-dir = {"" = "."}

# No packages yet (scripts-only repo). This makes `pip install -e .` work for deps.
# When you add a tap_tone/ package later, remove this and add proper package discovery.
