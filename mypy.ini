[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
strict_optional = False
ignore_missing_imports = True
check_untyped_defs = False
disallow_untyped_defs = False
show_error_codes = True
files = tap_tone_pi,tap_tone

# Relax strict checks for GUI code
[mypy-tap_tone_pi.gui.*]
ignore_errors = True

# Relax for agentic spine (heavy dynamic typing)
[mypy-tap_tone_pi.agentic.spine.*]
ignore_errors = True

# Relax for capture module
[mypy-tap_tone_pi.capture.*]
ignore_errors = True

# Relax for workflow
[mypy-tap_tone_pi.workflow.*]
ignore_errors = True

# Relax for agent messages (duck typing)
[mypy-tap_tone_pi.agent.*]
ignore_errors = True

# Relax for tap_tone compat layer
[mypy-tap_tone.*]
ignore_errors = True

# Ignore third-party libraries without stubs
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sounddevice.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-serial.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
