[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
strict_optional = False
ignore_missing_imports = True
check_untyped_defs = False
disallow_untyped_defs = False
show_error_codes = True
files = tap_tone_pi

# Relax strict checks for modules with dynamic typing
[mypy-tap_tone_pi.gui.*]
ignore_errors = True

[mypy-tap_tone_pi.agentic.*]
ignore_errors = True

[mypy-tap_tone_pi.capture.*]
ignore_errors = True

[mypy-tap_tone_pi.workflow.*]
ignore_errors = True

[mypy-tap_tone_pi.agent.*]
ignore_errors = True

[mypy-tap_tone_pi.io.*]
ignore_errors = True

[mypy-tap_tone_pi.cli.*]
ignore_errors = True


# Ignore third-party libraries
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sounddevice.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-serial.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
